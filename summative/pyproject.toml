[project]
name = "freelancer-rate-summative"
version = "1.0.0"
description = "Summative: freelancer hourly-rate regression model, FastAPI service, and Flutter client."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pandas==2.2.3",
    "numpy==2.2.1",
    "scikit-learn==1.6.0",
    "joblib==1.4.2",
    "python-multipart==0.0.20",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["API"]
